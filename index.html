<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Loomframe</title>
  <meta name="description" content="Loomframe: a free, offline, frame-by-frame animation studio. Draw it. Flip it. Loop it.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='14' width='34' height='38' rx='7' fill='%232EC4B6'/%3E%3Crect x='16' y='10' width='34' height='38' rx='7' fill='%23FFB627'/%3E%3Crect x='26' y='6' width='34' height='38' rx='7' fill='%23FF6B4A'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="logo" viewBox="0 0 64 64">
      <rect x="6" y="16" width="32" height="38" rx="7" fill="#2EC4B6"/>
      <rect x="16" y="11" width="32" height="38" rx="7" fill="#FFB627"/>
      <rect x="26" y="6" width="32" height="38" rx="7" fill="#FF6B4A"/>
      <path d="M8 46 C 22 30, 34 52, 56 18" stroke="#F7F2E8" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    </symbol>
  </svg>

  <!-- ===== Gallery ===== -->
  <section id="gallery" class="view">
    <header class="gallery-head">
      <div class="brand">
        <svg class="logo"><use href="#logo"/></svg>
        <div>
          <h1>Loomframe</h1>
          <p class="tagline">Draw it. Flip it. Loop it.</p>
        </div>
      </div>
      <div class="gallery-actions">
        <select id="newSize" aria-label="Canvas size">
          <option value="960x540">Wide 960×540</option>
          <option value="720x720">Square 720×720</option>
          <option value="540x960">Tall 540×960</option>
        </select>
        <button id="newBtn" class="btn primary">+ New loop</button>
        <label class="btn ghost" title="Import a .loomframe.json file">
          Import<input id="importInput" type="file" accept=".json,application/json" hidden>
        </label>
      </div>
    </header>
    <div id="shelf" class="shelf"></div>
    <p id="emptyShelf" class="empty" hidden>Your shelf is empty. Start a loop.</p>
    <footer class="foot">Everything is saved on this device. No account, no cloud.</footer>
  </section>

  <!-- ===== Studio ===== -->
  <section id="studio" class="view" hidden>
    <header class="topbar">
      <button id="backBtn" class="icon-btn" title="Back to shelf" aria-label="Back to shelf">
        <svg class="logo small"><use href="#logo"/></svg>
      </button>
      <input id="projName" class="name-input" aria-label="Project name" maxlength="60">
      <span id="saveState" class="save-state">Saved</span>
      <div class="spacer"></div>
      <button id="undoBtn" class="icon-btn" title="Undo (Ctrl/⌘ Z)" aria-label="Undo">↶</button>
      <button id="redoBtn" class="icon-btn" title="Redo (Shift Ctrl/⌘ Z)" aria-label="Redo">↷</button>
      <div class="menu">
        <button id="exportBtn" class="btn primary">Export</button>
        <div id="exportMenu" class="menu-list" hidden>
          <button data-export="gif">Animated GIF</button>
          <button data-export="sheet">Sprite sheet PNG</button>
          <button data-export="frame">Current frame PNG</button>
          <button data-export="json">Project file (.json)</button>
        </div>
      </div>
    </header>

    <div class="workspace">
      <nav class="tools" aria-label="Tools">
        <button class="tool active" data-tool="brush" title="Brush (B)" aria-label="Brush">
          <svg viewBox="0 0 24 24"><path d="M4 20c2 0 4-1 4-3s-1-3-3-3-2 2-1 6zM9 14l9-10 2 2-10 9z" fill="currentColor"/></svg>
        </button>
        <button class="tool" data-tool="eraser" title="Eraser (E)" aria-label="Eraser">
          <svg viewBox="0 0 24 24"><path d="M3 16l9-9 6 6-6 6H6zM10 19h11" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool" data-tool="fill" title="Fill (G)" aria-label="Fill">
          <svg viewBox="0 0 24 24"><path d="M5 11l7-7 7 7-7 7z" stroke="currentColor" stroke-width="2" fill="none"/><path d="M19 15c0 0 2 2.5 2 4a2 2 0 0 1-4 0c0-1.5 2-4 2-4z" fill="currentColor"/></svg>
        </button>
        <button class="tool" data-tool="picker" title="Colour picker (I)" aria-label="Colour picker">
          <svg viewBox="0 0 24 24"><path d="M14 4l6 6-2 2-6-6zM12 8l-8 8v4h4l8-8" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        </button>
        <div class="tool-sep"></div>
        <input id="colorInput" type="color" value="#16141f" title="Colour" aria-label="Colour">
      </nav>

      <main class="stage" id="stage">
        <canvas id="view"></canvas>
        <div id="cursor" class="cursor" hidden></div>
      </main>

      <aside class="panel" aria-label="Brush settings">
        <h3>Colour</h3>
        <div id="swatches" class="swatches"></div>
        <h3>Size <span id="sizeVal">8</span></h3>
        <input id="sizeInput" type="range" min="1" max="120" value="8">
        <h3>Opacity <span id="opVal">100%</span></h3>
        <input id="opInput" type="range" min="5" max="100" value="100">
        <h3>Canvas</h3>
        <label class="row">Paper <input id="bgInput" type="color" value="#f7f2e8"></label>
        <div class="hint">
          <b>Keys</b><br>
          B brush · E eraser · G fill · I pick<br>
          Space play · ← → frames<br>
          N new frame · D duplicate<br>
          O onion · [ ] size
        </div>
      </aside>
    </div>

    <footer class="timeline">
      <div class="transport">
        <button id="prevBtn" class="icon-btn" title="Previous frame (←)" aria-label="Previous frame">⏮</button>
        <button id="playBtn" class="icon-btn play" title="Play / pause (Space)" aria-label="Play">▶</button>
        <button id="nextBtn" class="icon-btn" title="Next frame (→)" aria-label="Next frame">⏭</button>
        <span id="frameLabel" class="frame-label">1 / 1</span>
        <label class="fps">FPS <input id="fpsInput" type="number" min="1" max="30" value="12"></label>
        <button id="onionBtn" class="chip on" title="Onion skin (O)">Onion</button>
        <div class="spacer"></div>
        <button id="addFrameBtn" class="chip" title="New blank frame (N)">+ Frame</button>
        <button id="dupFrameBtn" class="chip" title="Duplicate frame (D)">Duplicate</button>
        <button id="moveLeftBtn" class="chip" title="Move frame left">◀ Move</button>
        <button id="moveRightBtn" class="chip" title="Move frame right">Move ▶</button>
        <button id="delFrameBtn" class="chip danger" title="Delete frame">Delete</button>
      </div>
      <div class="tracks-wrap">
        <div id="tracks" class="tracks"></div>
      </div>
      <div class="layer-actions">
        <button id="addLayerBtn" class="chip">+ Layer</button>
        <button id="delLayerBtn" class="chip danger">Remove layer</button>
      </div>
    </footer>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script src="src/api.js"></script>
  <script src="src/gif.js"></script>
  <script src="src/model.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
